<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fish Tracker</title>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        color: #f5fbff;
        background: radial-gradient(circle at top left, rgba(17, 147, 173, 0.18), transparent 35%),
                    linear-gradient(180deg, #06151d 0%, #09232d 100%);
        min-height: 100vh;
    }

    header {
        padding: 30px 20px 20px;
        text-align: center;
        background: linear-gradient(135deg, #08758a, #063d4d);
        box-shadow: 0 5px 24px rgba(0,0,0,.35);
    }
    header h1 { margin: 0 0 8px; font-size: clamp(26px, 4vw, 42px); }

    .container {
        width: min(1400px, 95%);
        margin: 20px auto 40px;
    }

    .panel {
        background: rgba(10, 35, 45, .94);
        border: 1px solid #1b4b5b;
        border-radius: 14px;
        box-shadow: 0 8px 28px rgba(0,0,0,.22);
    }

    .stats { padding: 18px 20px; margin-bottom: 16px; }
    .stats-row {
        display: flex;
        justify-content: space-between;
        gap: 15px;
        align-items: center;
        flex-wrap: wrap;
    }
    #progressText { font-size: 20px; font-weight: 800; }
    #dbStatus { font-size: 13px; opacity: .8; text-align: right; }

    .progress {
        margin-top: 12px;
        height: 14px;
        border-radius: 50px;
        overflow: hidden;
        background: #123b49;
    }
    #progressFill {
        width: 0%;
        height: 100%;
        background: linear-gradient(90deg, #18b8d2, #53dfa7);
        transition: width .25s ease;
    }

    .controls {
        padding: 14px;
        margin-bottom: 16px;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
    }
    input[type="search"], select, input[type="date"], input[type="text"] {
        border: 1px solid #2c6070;
        background: #08212c;
        color: white;
        border-radius: 8px;
        padding: 10px 14px;
        outline: none;
        font-size: 14px;
    }
    input[type="search"] { flex: 2; min-width: 200px; }
    select { min-width: 150px; }
    input[type="search"]:focus, select:focus, input:focus { border-color: #20c5dd; }

    button {
        border: 0;
        border-radius: 8px;
        padding: 10px 16px;
        font-weight: 700;
        color: white;
        background: #0e6375;
        cursor: pointer;
        transition: background .15s ease;
    }
    button:hover { background: #157d92; }
    button.active { background: #20c5dd; color: #06151d; }
    button.secondary { background: #1b4b5b; }
    button.secondary:hover { background: #28677c; }
    button.danger { background: #8b3232; }
    button.danger:hover { background: #aa3d3d; }

    .fish-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 14px;
    }

    .fish-card {
        padding: 12px;
        background: #0a2732;
        border: 1px solid #1a4653;
        border-radius: 12px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        transition: transform .15s, border-color .15s;
        overflow: hidden;
    }
    .fish-card:hover { transform: translateY(-2px); border-color: #2e7c8d; }
    .fish-card.caught { background: #0b332b; border-color: #1ca778; }

    .img-container {
        width: 100%;
        height: 170px;
        background: #061821;
        border-radius: 8px;
        overflow: hidden;
        position: relative;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 2px dashed #1a4653;
        transition: border-color 0.2s, background 0.2s;
    }
    .img-container:hover {
        border-color: #20c5dd;
        background: #08212c;
    }

    .upload-placeholder {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        color: #afd0d8;
        font-size: 13px;
        user-select: none;
    }
    .upload-icon { font-size: 24px; }

    .fish-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .remove-img-btn {
        position: absolute;
        top: 6px;
        right: 6px;
        background: rgba(0,0,0,0.7);
        color: #fff;
        border: none;
        border-radius: 50%;
        width: 26px;
        height: 26px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        line-height: 1;
        padding: 0;
        z-index: 2;
    }
    .remove-img-btn:hover { background: #8b3232; }

    .card-header {
        display: flex;
        align-items: flex-start;
        gap: 10px;
    }

    .check {
        width: 22px;
        height: 22px;
        min-width: 22px;
        accent-color: #22bc82;
        cursor: pointer;
        margin-top: 2px;
    }
    .name { font-weight: 800; font-size: 15px; line-height: 1.25; }
    .scientific { margin-top: 4px; font-size: 12px; font-style: italic; color: #afd0d8; }
    .tag {
        display: inline-block;
        padding: 3px 8px;
        margin-top: 6px;
        border-radius: 999px;
        background: #123b47;
        color: #bde6ed;
        font-size: 11px;
        font-weight: 600;
    }
    .caught-label { margin-left: auto; font-size: 10px; font-weight: 900; color: #56e0ad; letter-spacing: 0.5px; }

    .catch-details {
        margin-top: 6px;
        padding-top: 10px;
        border-top: 1px solid rgba(255, 255, 255, 0.12);
        display: flex;
        flex-direction: column;
        gap: 8px;
    }
    .catch-details {
        margin-top: 6px;
        padding-top: 10px;
        border-top: 1px solid rgba(255, 255, 255, 0.12);
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .catch-field {
        display: flex;
        flex-direction: column;
        gap: 4px;
    }

    .catch-field label {
        font-size: 11px;
        font-weight: 800;
        color: #afd0d8;
    }

    .catch-field input {
        font-size: 12px;
        padding: 7px 10px;
        width: 100%;
    }

    #empty { display: none; text-align: center; padding: 40px; opacity: .7; }

    /* ---- Crop/Edit modal ---- */
    .crop-modal {
        position: fixed;
        inset: 0;
        z-index: 1000;
        background: rgba(3, 12, 16, .82);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
    }
    .crop-modal-box {
        background: #0a2732;
        border: 1px solid #2c6070;
        border-radius: 14px;
        padding: 18px;
        width: min(600px, 100%);
        box-shadow: 0 12px 40px rgba(0,0,0,.5);
    }
    .crop-title { font-size: 18px; font-weight: 800; margin-bottom: 4px; }
    .crop-hint { font-size: 12px; color: #afd0d8; margin-bottom: 12px; }
    .crop-viewport {
        width: 100%;
        height: 240px;               /* fixed height so the viewport never collapses */
        overflow: hidden;
        position: relative;
        background: #061821;
        border: 1px solid #2c6070;
        border-radius: 8px;
        cursor: grab;
        touch-action: none;
    }
    @media (max-width: 480px) { .crop-viewport { height: 200px; } }
    .crop-viewport.dragging { cursor: grabbing; }
    .crop-viewport canvas {
        display: block;
        width: 100%;
        height: 100%;
        pointer-events: none;
        user-select: none;
        -webkit-user-drag: none;
    }
    .crop-controls {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 14px 0 4px;
    }
    .crop-controls label { font-size: 12px; color: #afd0d8; font-weight: 800; }
    .crop-controls input[type="range"] { flex: 1; accent-color: #20c5dd; min-width: 0; }
    .crop-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 12px; }
</style>
</head>

<body>

<header>
    <h1>🎣 Fish Tracker 🎣</h1>
</header>

<main class="container">

    <section class="panel stats">
        <div class="stats-row">
            <div id="progressText">0 / 0 Caught</div>
            <div id="dbStatus">FishBase-researched species catalog</div>
        </div>
        <div class="progress">
            <div id="progressFill"></div>
        </div>
    </section>

    <section class="panel controls">
        <input id="search" type="search" placeholder="Search species, scientific name, or water type..." oninput="render()">
        <select id="categoryFilter" onchange="render()">
            <option value="all">All Categories</option>
            <option value="Freshwater">Freshwater</option>
            <option value="Saltwater Inshore">Saltwater Inshore</option>
            <option value="Saltwater Offshore">Saltwater Offshore</option>
            <option value="Sharks & Rays">Sharks & Rays</option>
            <option value="Prehistoric & Fossil">Prehistoric & Fossil</option>
        </select>
        <button id="btn-all" class="active" onclick="setFilter('all')">All</button>
        <button id="btn-caught" onclick="setFilter('caught')">Caught</button>
        <button id="btn-uncaught" onclick="setFilter('uncaught')">Uncaught</button>
        <button class="secondary" onclick="exportData()">Export Data</button>
        <button class="secondary" onclick="document.getElementById('importFile').click()">Import Data</button>
        <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
        <button class="danger" onclick="resetCaught()">Reset Progress</button>
    </section>

    <div id="fishGrid" class="fish-grid"></div>

    <div id="empty">No species matching your criteria.</div>

    <input type="file" id="cardImageInput" accept="image/*" style="display:none">

    <!-- Crop/Edit modal -->
    <div id="cropModal" class="crop-modal" style="display:none">
        <div class="crop-modal-box">
            <div class="crop-title">📷 Position &amp; Crop</div>
            <div class="crop-hint">Drag to move the photo &middot; use the slider or scroll to zoom in/out</div>
            <div class="crop-viewport" id="cropViewport">
                <canvas id="cropCanvas"></canvas>
            </div>
            <div class="crop-controls">
                <label for="cropZoom">Zoom</label>
                <input type="range" id="cropZoom" min="1" max="6" step="0.01" value="1">
            </div>
            <div class="crop-actions">
                <button class="secondary" id="cropCancel">Cancel</button>
                <button class="active" id="cropDone">Done</button>
            </div>
        </div>
    </div>

</main>

let caughtData = {};
let currentStatusFilter = 'all';
let activeUploadKey = null;

function loadStorage() {
    try {
        const raw = localStorage.getItem(STORAGE_KEY_CAUGHT);
        if (raw) {
            caughtData = JSON.parse(raw);
        }
    } catch (e) {
        console.error("Failed to load caught data:", e);
        caughtData = {};
    }
}

function saveStorage() {
    try {
        localStorage.setItem(STORAGE_KEY_CAUGHT, JSON.stringify(caughtData));
    } catch (e) {
        console.error("Failed to save caught data:", e);
    }
}

function getFishKey(fish) {
    return fish.common + "___" + fish.scientific;
}

function getFishRecord(key) {
    if (!caughtData[key]) {
        caughtData[key] = { caught: false, date: "", notes: "", img: "" };
    }
    return caughtData[key];
}

function setFilter(status) {
    currentStatusFilter = status;
    document.querySelectorAll('.controls button[id^="btn-"]').forEach(btn => {
        btn.classList.remove('active');
    });
    const targetBtn = document.getElementById(`btn-${status}`);
    if (targetBtn) targetBtn.classList.add('active');
    render();
}

function toggleCaught(key) {
    const record = getFishRecord(key);
    record.caught = !record.caught;
    if (record.caught && !record.date) {
        record.date = new Date().toISOString().split('T')[0];
    }
    saveStorage();
    render();
}

function updateField(key, field, value) {
    const record = getFishRecord(key);
    record[field] = value;
    saveStorage();
}

function triggerImageUpload(key) {
    activeUploadKey = key;
    const fileInput = document.getElementById('cardImageInput');
    fileInput.value = '';
    fileInput.click();
}

function removeImage(key) {
    const record = getFishRecord(key);
    record.img = "";
    saveStorage();
    render();
}

/* ============ Crop/Edit image flow ============ */

let cropState = {
    source: null,       // drawable source: ImageBitmap or HTMLImageElement (fully loaded)
    url: null,          // object URL to revoke on close
    natW: 0, natH: 0,   // natural pixel dimensions
    baseScale: 1,       // scale that makes image cover the viewport
    zoom: 1,            // user zoom multiplier (1 = fit/crop at viewport)
    tx: 0, ty: 0        // rendered top-left offset within viewport (px)
};

const cropModal = document.getElementById('cropModal');
const cropViewport = document.getElementById('cropViewport');
const cropCanvas = document.getElementById('cropCanvas');
const cropZoom = document.getElementById('cropZoom');

// Load the chosen file, decode it fully, then open the crop editor.
function openCropEditor(file) {
    if (window.createImageBitmap) {
        createImageBitmap(file, { imageOrientation: 'from-image' }).then(function (bitmap) {
            startEditor(bitmap, bitmap.width, bitmap.height);
        }).catch(function () {
            loadViaImage(file);
        });
    } else {
        loadViaImage(file);
    }
}

// Fallback: load through an <img> and wait for it to fully decode before editing.
function loadViaImage(file) {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = function () {
        cropState.url = url;
        startEditor(img, img.naturalWidth, img.naturalHeight);
    };
    img.onerror = function () {
        URL.revokeObjectURL(url);
        alert('Sorry, that image could not be loaded.');
    };
    img.src = url;
}

// Size the canvas to the visible viewport, then show the editor and center the image.
function startEditor(source, w, h) {
    cropState.source = source;
    cropState.natW = w;
    cropState.natH = h;

    // Show the modal BEFORE measuring, so the viewport has real dimensions.
    cropModal.style.display = 'flex';
    cropCanvas.width = cropViewport.clientWidth;
    cropCanvas.height = cropViewport.clientHeight;

    // Start centered, zoomed just enough to cover the crop area (like object-fit: cover).
    const vw = cropCanvas.width;
    const vh = cropCanvas.height;
    cropState.baseScale = Math.max(vw / w, vh / h);
    cropState.zoom = 1;
    const dw = w * cropState.baseScale;
    const dh = h * cropState.baseScale;
    cropState.tx = (vw - dw) / 2;
    cropState.ty = (vh - dh) / 2;

    cropZoom.value = 1;
    redraw();
}

function closeCropEditor() {
    cropModal.style.display = 'none';
    const ctx = cropCanvas.getContext('2d');
    ctx.clearRect(0, 0, cropCanvas.width, cropCanvas.height);
    if (cropState.source && typeof cropState.source.close === 'function') {
        cropState.source.close();
    }
    if (cropState.url) { URL.revokeObjectURL(cropState.url); cropState.url = null; }
    cropState.source = null;
    cropState.natW = 0; cropState.natH = 0;
}

// Draw the image on the canvas at its current position/zoom.
function redraw() {
    if (!cropState.source) return;
    const vw = cropCanvas.width;
    const vh = cropCanvas.height;
    const scale = cropState.baseScale * cropState.zoom;
    const dw = cropState.natW * scale;
    const dh = cropState.natH * scale;

    // Keep the image covering the crop area at all times
    cropState.tx = Math.min(0, Math.max(vw - dw, cropState.tx));
    cropState.ty = Math.min(0, Math.max(vh - dh, cropState.ty));

    const ctx = cropCanvas.getContext('2d');
    ctx.clearRect(0, 0, vw, vh);
    ctx.fillStyle = '#061821';
    ctx.fillRect(0, 0, vw, vh);
    ctx.setTransform(scale, 0, 0, scale, cropState.tx, cropState.ty);
    ctx.drawImage(cropState.source, 0, 0);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
}

// --- Drag to move (mouse + touch) ---
let dragStartX = 0, dragStartY = 0, dragStartTx = 0, dragStartTy = 0, dragging = false;

cropViewport.addEventListener('pointerdown', function (e) {
    dragging = true;
    dragStartX = e.clientX;
    dragStartY = e.clientY;
    dragStartTx = cropState.tx;
    dragStartTy = cropState.ty;
    cropViewport.classList.add('dragging');
    cropViewport.setPointerCapture(e.pointerId);
});

cropViewport.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    cropState.tx = dragStartTx + (e.clientX - dragStartX);
    cropState.ty = dragStartTy + (e.clientY - dragStartY);
    redraw();
});

function endDrag(e) {
    if (!dragging) return;
    dragging = false;
    cropViewport.classList.remove('dragging');
}
cropViewport.addEventListener('pointerup', endDrag);
cropViewport.addEventListener('pointercancel', endDrag);

// --- Zoom ---
cropZoom.addEventListener('input', function () {
    cropState.zoom = parseFloat(cropZoom.value);
    redraw();
});

// Mouse wheel / pinch-trackpad zoom (zooms toward cursor)
cropViewport.addEventListener('wheel', function (e) {
    e.preventDefault();
    const factor = e.deltaY < 0 ? 1.1 : 1 / 1.1;
    setCropZoom(cropState.zoom * factor);
}, { passive: false });

function setCropZoom(newZoom) {
    newZoom = Math.min(6, Math.max(1, newZoom));
    cropZoom.value = newZoom;
    cropState.zoom = newZoom;
    redraw();
}

// --- Done: crop the exact visible area and save it ---
document.getElementById('cropDone').addEventListener('click', function () {
    if (!cropState.source || !activeUploadKey) return;

    const vw = cropCanvas.width;
    const vh = cropCanvas.height;
    const scale = cropState.baseScale * cropState.zoom;

    // Visible crop-area rectangle mapped back to source-image pixel coordinates
    let sx = -cropState.tx / scale;
    let sy = -cropState.ty / scale;
    let sw = vw / scale;
    let sh = vh / scale;

    // Clamp to the actual image bounds (float drift safety)
    sx = Math.max(0, Math.min(sx, cropState.natW));
    sy = Math.max(0, Math.min(sy, cropState.natH));
    sw = Math.min(sw, cropState.natW - sx);
    sh = Math.min(sh, cropState.natH - sy);
    if (sw < 1 || sh < 1) {
        alert('Please position the photo within the crop area before saving.');
        return;
    }

    // Render at 2x crop-area resolution for a crisp saved photo
    const outW = Math.max(1, Math.round(vw * 2));
    const outH = Math.max(1, Math.round(vh * 2));
    const canvas = document.createElement('canvas');
    canvas.width = outW;
    canvas.height = outH;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(cropState.source, sx, sy, sw, sh, 0, 0, outW, outH);

    const record = getFishRecord(activeUploadKey);
    record.img = canvas.toDataURL('image/jpeg', 0.9);
    saveStorage();
    closeCropEditor();
    render();
});

// --- Cancel: keep the previous image, close the editor ---
document.getElementById('cropCancel').addEventListener('click', function () {
    closeCropEditor();
});

// Keep the crop in bounds if the window is resized
window.addEventListener('resize', function () {
    if (cropModal.style.display === 'none') return;
    cropCanvas.width = cropViewport.clientWidth;
    cropCanvas.height = cropViewport.clientHeight;
    cropState.baseScale = Math.max(cropCanvas.width / cropState.natW, cropCanvas.height / cropState.natH);
    redraw();
});

// Open the crop editor instead of saving the image directly
const CROP_FILE_INPUT = document.getElementById('cardImageInput');
CROP_FILE_INPUT.addEventListener('change', function (e) {
    const file = e.target.files[0];
    if (!file || !activeUploadKey) return;
    openCropEditor(file);
});

function render() {
    const searchVal = document.getElementById('search').value.toLowerCase().trim();
    const catVal = document.getElementById('categoryFilter').value;
    const grid = document.getElementById('fishGrid');
    const emptyMsg = document.getElementById('empty');
    
    // Stats Calculation
    let totalCaught = 0;
    BASE_SPECIES.forEach(fish => {
        const key = getFishKey(fish);
        if (caughtData[key] && caughtData[key].caught) {
            totalCaught++;
        }
    });

    const totalSpecies = BASE_SPECIES.length;
    const percentage = totalSpecies > 0 ? Math.round((totalCaught / totalSpecies) * 100) : 0;
    
    document.getElementById('progressText').innerText = `${totalCaught} / ${totalSpecies} Caught (${percentage}%)`;
    document.getElementById('progressFill').style.width = `${percentage}%`;

    // Filter Species
    const filtered = BASE_SPECIES.filter(fish => {
        const key = getFishKey(fish);
        const record = getFishRecord(key);

        if (currentStatusFilter === 'caught' && !record.caught) return false;
        if (currentStatusFilter === 'uncaught' && record.caught) return false;

        if (catVal !== 'all' && fish.cat !== catVal) return false;

        if (searchVal) {
            const matchName = fish.common.toLowerCase().includes(searchVal);
            const matchSci = fish.scientific.toLowerCase().includes(searchVal);
            const matchCat = fish.cat.toLowerCase().includes(searchVal);
            if (!matchName && !matchSci && !matchCat) return false;
        }

        return true;
    });

    grid.innerHTML = '';

    if (filtered.length === 0) {
        emptyMsg.style.display = 'block';
        return;
    } else {
        emptyMsg.style.display = 'none';
    }

    const fragment = document.createDocumentFragment();

    filtered.forEach(fish => {
        const key = getFishKey(fish);
        const record = getFishRecord(key);

        const card = document.createElement('div');
        card.className = `fish-card ${record.caught ? 'caught' : ''}`;

        // Image Container
        const imgContainer = document.createElement('div');
        imgContainer.className = 'img-container';
        
        if (record.img) {
            const img = document.createElement('img');
            img.src = record.img;
            img.alt = fish.common;
            img.className = 'fish-img';
            imgContainer.appendChild(img);

            const removeBtn = document.createElement('button');
            removeBtn.className = 'remove-img-btn';
            removeBtn.innerHTML = '✕';
            removeBtn.title = 'Remove Photo';
            removeBtn.onclick = (e) => {
                e.stopPropagation();
                removeImage(key);
            };
            imgContainer.appendChild(removeBtn);
            imgContainer.onclick = () => triggerImageUpload(key);
        } else {
            const placeholder = document.createElement('div');
            placeholder.className = 'upload-placeholder';
            placeholder.innerHTML = `<span class="upload-icon">📷</span><span>Click to upload photo</span>`;
            imgContainer.appendChild(placeholder);
            imgContainer.onclick = () => triggerImageUpload(key);
        }

        // Card Header
        const cardHeader = document.createElement('div');
        cardHeader.className = 'card-header';

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.className = 'check';
        checkbox.checked = record.caught;
        checkbox.onchange = () => toggleCaught(key);

        const titleBox = document.createElement('div');
        titleBox.style.flex = '1';

        const nameDiv = document.createElement('div');
        nameDiv.className = 'name';
        nameDiv.textContent = fish.common;

        const sciDiv = document.createElement('div');
        sciDiv.className = 'scientific';
        sciDiv.textContent = fish.scientific;

        const tagSpan = document.createElement('span');
        tagSpan.className = 'tag';
        tagSpan.textContent = fish.cat;

        titleBox.appendChild(nameDiv);
        titleBox.appendChild(sciDiv);
        titleBox.appendChild(tagSpan);

        cardHeader.appendChild(checkbox);
        cardHeader.appendChild(titleBox);

        if (record.caught) {
            const caughtLabel = document.createElement('div');
            caughtLabel.className = 'caught-label';
            caughtLabel.textContent = 'CAUGHT';
            cardHeader.appendChild(caughtLabel);
        }

        card.appendChild(imgContainer);
        card.appendChild(cardHeader);

        // Catch Details
        if (record.caught) {
            const details = document.createElement('div');
            details.className = 'catch-details';

            const dateField = document.createElement('div');
            dateField.className = 'catch-field';
            const dateLabel = document.createElement('label');
            dateLabel.textContent = '1. Date';
            const dateInput = document.createElement('input');
            dateInput.type = 'date';
            dateInput.value = record.date || '';
            dateInput.onchange = (e) => updateField(key, 'date', e.target.value);
            dateField.appendChild(dateLabel);
            dateField.appendChild(dateInput);

            const weightField = document.createElement('div');
            weightField.className = 'catch-field';
            const weightLabel = document.createElement('label');
            weightLabel.textContent = '2. Weight';
            const weightInput = document.createElement('input');
            weightInput.type = 'text';
            weightInput.inputMode = 'decimal';
            weightInput.placeholder = 'Enter weight';
            weightInput.value = record.weight || '';
            weightInput.oninput = (e) => updateField(key, 'weight', e.target.value);
            weightField.appendChild(weightLabel);
            weightField.appendChild(weightInput);

            const lengthField = document.createElement('div');
            lengthField.className = 'catch-field';
            const lengthLabel = document.createElement('label');
            lengthLabel.textContent = '3. Length';
            const lengthInput = document.createElement('input');
            lengthInput.type = 'text';
            lengthInput.inputMode = 'decimal';
            lengthInput.placeholder = 'Enter length';
            lengthInput.value = record.length || '';
            lengthInput.oninput = (e) => updateField(key, 'length', e.target.value);
            lengthField.appendChild(lengthLabel);
            lengthField.appendChild(lengthInput);

            const notesField = document.createElement('div');
            notesField.className = 'catch-field';
            const notesLabel = document.createElement('label');
            notesLabel.textContent = '4. Notes';
            const notesInput = document.createElement('input');
            notesInput.type = 'text';
            notesInput.placeholder = 'Location, bait, conditions, etc.';
            notesInput.value = record.notes || '';
            notesInput.oninput = (e) => updateField(key, 'notes', e.target.value);
            notesField.appendChild(notesLabel);
            notesField.appendChild(notesInput);

            details.appendChild(dateField);
            details.appendChild(weightField);
            details.appendChild(lengthField);
            details.appendChild(notesField);
            card.appendChild(details);
        }

        fragment.appendChild(card);
    });

    grid.appendChild(fragment);
}

function exportData() {
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(caughtData, null, 2));
    const downloadAnchor = document.createElement('a');
    downloadAnchor.setAttribute("href", dataStr);
    downloadAnchor.setAttribute("download", `fish_tracker_export_${new Date().toISOString().split('T')[0]}.json`);
    document.body.appendChild(downloadAnchor);
    downloadAnchor.click();
    downloadAnchor.remove();
}

function importData(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            const imported = JSON.parse(e.target.result);
            if (typeof imported === 'object' && imported !== null) {
                caughtData = imported;
                saveStorage();
                render();
                alert('Data imported successfully!');
            } else {
                alert('Invalid JSON structure.');
            }
        } catch (err) {
            alert('Failed to parse JSON file.');
        }
    };
    reader.readAsText(file);
}

function resetCaught() {
    if (confirm("Are you sure you want to reset all catch progress and photos? This action cannot be undone.")) {
        caughtData = {};
        saveStorage();
        render();
    }
}

window.addEventListener('DOMContentLoaded', () => {
    loadStorage();
    render();
});
