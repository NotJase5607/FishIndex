<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fish Tracker</title>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        color: #f5fbff;
        background: radial-gradient(circle at top left, rgba(17, 147, 173, 0.18), transparent 35%),
                    linear-gradient(180deg, #06151d 0%, #09232d 100%);
        min-height: 100vh;
    }

    header {
        padding: 30px 20px 20px;
        text-align: center;
        background: linear-gradient(135deg, #08758a, #063d4d);
        box-shadow: 0 5px 24px rgba(0,0,0,.35);
    }
    header h1 { margin: 0 0 8px; font-size: clamp(26px, 4vw, 42px); }

    .container {
        width: min(1400px, 95%);
        margin: 20px auto 40px;
    }

    .panel {
        background: rgba(10, 35, 45, .94);
        border: 1px solid #1b4b5b;
        border-radius: 14px;
        box-shadow: 0 8px 28px rgba(0,0,0,.22);
    }

    .stats { padding: 18px 20px; margin-bottom: 16px; }
    .stats-row {
        display: flex;
        justify-content: space-between;
        gap: 15px;
        align-items: center;
        flex-wrap: wrap;
    }
    #progressText { font-size: 20px; font-weight: 800; }
    #dbStatus { font-size: 13px; opacity: .8; text-align: right; }

    .progress {
        margin-top: 12px;
        height: 14px;
        border-radius: 50px;
        overflow: hidden;
        background: #123b49;
    }
    #progressFill {
        width: 0%;
        height: 100%;
        background: linear-gradient(90deg, #18b8d2, #53dfa7);
        transition: width .25s ease;
    }

    .controls {
        padding: 14px;
        margin-bottom: 16px;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
    }
    input[type="search"], select, input[type="date"], input[type="text"] {
        border: 1px solid #2c6070;
        background: #08212c;
        color: white;
        border-radius: 8px;
        padding: 10px 14px;
        outline: none;
        font-size: 14px;
    }
    input[type="search"] { flex: 2; min-width: 200px; }
    select { min-width: 150px; }
    input[type="search"]:focus, select:focus, input:focus { border-color: #20c5dd; }

    button {
        border: 0;
        border-radius: 8px;
        padding: 10px 16px;
        font-weight: 700;
        color: white;
        background: #0e6375;
        cursor: pointer;
        transition: background .15s ease;
    }
    button:hover { background: #157d92; }
    button.active { background: #20c5dd; color: #06151d; }
    button.secondary { background: #1b4b5b; }
    button.secondary:hover { background: #28677c; }
    button.danger { background: #8b3232; }
    button.danger:hover { background: #aa3d3d; }

    .fish-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 14px;
    }

    .fish-card {
        padding: 12px;
        background: #0a2732;
        border: 1px solid #1a4653;
        border-radius: 12px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        transition: transform .15s, border-color .15s;
        overflow: hidden;
    }
    .fish-card:hover { transform: translateY(-2px); border-color: #2e7c8d; }
    .fish-card.caught { background: #0b332b; border-color: #1ca778; }

    .img-container {
        width: 100%;
        height: 170px;
        background: #061821;
        border-radius: 8px;
        overflow: hidden;
        position: relative;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 2px dashed #1a4653;
        transition: border-color 0.2s, background 0.2s;
    }
    .img-container:hover {
        border-color: #20c5dd;
        background: #08212c;
    }

    .upload-placeholder {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        color: #afd0d8;
        font-size: 13px;
        user-select: none;
    }
    .upload-icon { font-size: 24px; }

    .fish-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .remove-img-btn {
        position: absolute;
        top: 6px;
        right: 6px;
        background: rgba(0,0,0,0.7);
        color: #fff;
        border: none;
        border-radius: 50%;
        width: 26px;
        height: 26px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        line-height: 1;
        padding: 0;
        z-index: 2;
    }
    .remove-img-btn:hover { background: #8b3232; }

    .card-header {
        display: flex;
        align-items: flex-start;
        gap: 10px;
    }

    .check {
        width: 22px;
        height: 22px;
        min-width: 22px;
        accent-color: #22bc82;
        cursor: pointer;
        margin-top: 2px;
    }
    .name { font-weight: 800; font-size: 15px; line-height: 1.25; }
    .scientific { margin-top: 4px; font-size: 12px; font-style: italic; color: #afd0d8; }
    .tag {
        display: inline-block;
        padding: 3px 8px;
        margin-top: 6px;
        border-radius: 999px;
        background: #123b47;
        color: #bde6ed;
        font-size: 11px;
        font-weight: 600;
    }
    .caught-label { margin-left: auto; font-size: 10px; font-weight: 900; color: #56e0ad; letter-spacing: 0.5px; }

    .catch-details {
        margin-top: 6px;
        padding-top: 10px;
        border-top: 1px solid rgba(255, 255, 255, 0.12);
        display: flex;
        flex-direction: column;
        gap: 8px;
    }
    .catch-details-row {
        display: flex;
        gap: 8px;
    }
    .catch-details input {
        font-size: 12px;
        padding: 6px 10px;
        width: 100%;
    }

    #empty { display: none; text-align: center; padding: 40px; opacity: .7; }
</style>
</head>

<body>

<header>
    <h1>🎣 Fish Tracker 🎣</h1>
</header>

<main class="container">

    <section class="panel stats">

        </div>
        <div class="progress">
            <div id="progressFill"></div>
        </div>
    </section>

    <section class="panel controls">
        <input id="search" type="search" placeholder="Search species, scientific name, or water type...">
        <select id="categoryFilter" onchange="render()">
            <option value="all">All Categories</option>
            <option value="Freshwater">Freshwater</option>
            <option value="Saltwater Inshore">Saltwater Inshore</option>
            <option value="Saltwater Offshore">Saltwater Offshore</option>
            <option value="Sharks & Rays">Sharks & Rays</option>
        </select>
        <button id="btn-all" class="active" onclick="setFilter('all')">All</button>
        <button id="btn-caught" onclick="setFilter('caught')">Caught</button>
        <button id="btn-uncaught" onclick="setFilter('uncaught')">Uncaught</button>
        <button class="secondary" onclick="exportData()">Export Data</button>
        <button class="secondary" onclick="document.getElementById('importFile').click()">Import Data</button>
        <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
        <button class="danger" onclick="resetCaught()">Reset Progress</button>
    </section>

    <div id="fishGrid" class="fish-grid"></div>

    <div id="empty">No species matching your criteria.</div>

</main>

// Remove duplicate items by common name + scientific name
const SPECIES_MAP = new Map();
BASE_SPECIES.forEach(item => {
    const key = (item.common + "||" + item.scientific).toLowerCase();
    if (!SPECIES_MAP.has(key)) {
        SPECIES_MAP.set(key, item);
    }
});
const UNIQUE_SPECIES = Array.from(SPECIES_MAP.values());

let caughtMap = loadCaught();
let currentFilter = "all";

function loadCaught() {
    try {
        const raw = JSON.parse(localStorage.getItem(STORAGE_KEY_CAUGHT) || "{}");
        const normalized = {};
        for (const key in raw) {
            if (typeof raw[key] === "boolean") {
                if (raw[key]) normalized[key] = { caught: true };
            } else if (typeof raw[key] === "object" && raw[key] !== null) {
                normalized[key] = raw[key];
            }
        }
        return normalized;
    } catch { return {}; }
}

function saveCaught() {
    localStorage.setItem(STORAGE_KEY_CAUGHT, JSON.stringify(caughtMap));
}

function escapeHTML(str) {
    return String(str || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}

function triggerImageUpload(id) {
    document.getElementById(`file_${id}`)?.click();
}

function handleImageUpload(id, event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
        if (!caughtMap[id]) {
            caughtMap[id] = { 
                caught: true, 
                date: new Date().toISOString().split('T')[0], 
                weight: '', 
                length: '', 
                location: '' 
            };
        }
        caughtMap[id].image = e.target.result;
        saveCaught();
        render();
    };
    reader.readAsDataURL(file);
}

function removeImage(id, event) {
    event.stopPropagation();
    if (caughtMap[id] && caughtMap[id].image) {
        delete caughtMap[id].image;
        saveCaught();
        render();
    }
}

function getFilteredList() {
    const query = document.getElementById("search").value.trim().toLowerCase();
    const catVal = document.getElementById("categoryFilter").value;

    return UNIQUE_SPECIES.filter((item, idx) => {
        const id = "g_fish_" + idx;
        const isCaught = !!caughtMap[id]?.caught;

        const matchesQuery = !query || 
            item.common.toLowerCase().includes(query) || 
            item.scientific.toLowerCase().includes(query) ||
            item.cat.toLowerCase().includes(query);

        const matchesCat = catVal === "all" || item.cat === catVal;

        const matchesFilter = currentFilter === "all" || 
            (currentFilter === "caught" && isCaught) || 
            (currentFilter === "uncaught" && !isCaught);

        return matchesQuery && matchesCat && matchesFilter;
    });
}

function render() {
    const filtered = getFilteredList();
    const grid = document.getElementById("fishGrid");
    const empty = document.getElementById("empty");

    if (filtered.length === 0) {
        grid.innerHTML = "";
        empty.style.display = "block";
    } else {
        empty.style.display = "none";
        grid.innerHTML = filtered.map(item => {
            const originalIndex = UNIQUE_SPECIES.indexOf(item);
            const id = "g_fish_" + originalIndex;
            const entry = caughtMap[id] || {};
            const caught = !!entry.caught;

            return `
                <article class="fish-card ${caught ? 'caught' : ''}">
                    <div class="img-container" onclick="triggerImageUpload('${id}')" title="Click to upload photo">
                        ${entry.image ? `
                            <button class="remove-img-btn" onclick="removeImage('${id}', event)" title="Remove Photo">✕</button>
                            <img class="fish-img" src="${escapeHTML(entry.image)}" alt="${escapeHTML(item.common)}">
                        ` : `
                            <div class="upload-placeholder">
                                <span class="upload-icon">📷</span>
                                <span>Upload Photo</span>
                            </div>
                        `}
                        <input type="file" id="file_${id}" accept="image/*" style="display:none" onchange="handleImageUpload('${id}', event)">
                    </div>
                    <div class="card-header">
                        <input class="check" type="checkbox" ${caught ? 'checked' : ''} 
                               onchange="toggleCaught('${id}', this.checked)">
                        <div style="min-width:0; flex:1;">
                            <div class="name">${escapeHTML(item.common)}</div>
                            <div class="scientific">${escapeHTML(item.scientific)}</div>
                            <span class="tag">${escapeHTML(item.cat)}</span>
                        </div>
                        ${caught ? '<div class="caught-label">CAUGHT</div>' : ''}
                    </div>
                    ${caught ? `
                        <div class="catch-details">
                            <div class="catch-details-row">
                                <input type="date" value="${escapeHTML(entry.date || '')}" placeholder="Date" onchange="updateCatchField('${id}', 'date', this.value)">
                                <input type="text" value="${escapeHTML(entry.weight || '')}" placeholder="Weight (e.g. 5 lbs)" onchange="updateCatchField('${id}', 'weight', this.value)">
                            </div>
                            <div class="catch-details-row">
                                <input type="text" value="${escapeHTML(entry.length || '')}" placeholder="Length (e.g. 22 in)" onchange="updateCatchField('${id}', 'length', this.value)">
                                <input type="text" value="${escapeHTML(entry.location || '')}" placeholder="Location / Notes" onchange="updateCatchField('${id}', 'location', this.value)">
                            </div>
                        </div>
                    ` : ''}
                </article>
            `;
        }).join("");
    }

    const totalCaught = Object.values(caughtMap).filter(x => x.caught).length;
    const pct = UNIQUE_SPECIES.length ? Math.round((totalCaught / UNIQUE_SPECIES.length) * 100) : 0;
    document.getElementById("progressText").textContent = `${totalCaught} / ${UNIQUE_SPECIES.length} Logged`;
    document.getElementById("progressFill").style.width = `${pct}%`;
    document.getElementById("dbStatus").textContent = `${UNIQUE_SPECIES.length} Total Species Active`;
}

function toggleCaught(id, isChecked) {
    if (isChecked) {
        if (!caughtMap[id]) {
            caughtMap[id] = { 
                caught: true, 
                date: new Date().toISOString().split('T')[0], 
                weight: '', 
                length: '', 
                location: '' 
            };
        } else {
            caughtMap[id].caught = true;
        }
    } else {
        delete caughtMap[id];
    }
    saveCaught();
    render();
}

function updateCatchField(id, field, value) {
    if (!caughtMap[id]) caughtMap[id] = { caught: true };
    caughtMap[id][field] = value;
    saveCaught();
}

function setFilter(filter) {
    currentFilter = filter;
    document.querySelectorAll('.controls button').forEach(btn => {
        if(btn.id.startsWith('btn-')) btn.classList.remove('active');
    });
    document.getElementById(`btn-${filter}`)?.classList.add('active');
    render();
}

function resetCaught() {
    if (confirm("Clear all recorded catches?")) {
        caughtMap = {};
        saveCaught();
        render();
    }
}

function exportData() {
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(caughtMap, null, 2));
    const downloadAnchor = document.createElement('a');
    downloadAnchor.setAttribute("href", dataStr);
    downloadAnchor.setAttribute("download", `angler_tracker_backup_${new Date().toISOString().split('T')[0]}.json`);
    document.body.appendChild(downloadAnchor);
    downloadAnchor.click();
    downloadAnchor.remove();
}

function importData(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            const imported = JSON.parse(e.target.result);
            if (typeof imported === 'object' && imported !== null) {
                caughtMap = imported;
                saveCaught();
                render();
                alert("Catch log imported successfully!");
            }
        } catch (err) {
            alert("Invalid JSON backup file.");
        }
    };
    reader.readAsText(file);
}

document.getElementById("search").addEventListener("input", render);

render();
</script>
